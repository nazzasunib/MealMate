name: Build MealMate APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

# Needed so the job can create/update the "latest-apk" GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Capacitor 8 CLI requires Node 22+.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # Installs @capacitor/android into node_modules. android/capacitor.settings.gradle
      # points the ':capacitor-android' Gradle project at node_modules/@capacitor/android/capacitor.
      - name: Install npm dependencies
        run: npm ci

      # Generates android/capacitor-cordova-android-plugins/ (incl. cordova.variables.gradle),
      # copies web assets + capacitor.config.json into the Android project.
      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Capacitor 8 compiles with Java 21 (see android/app/capacitor.build.gradle).
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mealmate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to "latest-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: MealMate — Latest APK
          body: "Auto-built from the latest main branch. Debug build — for testing/installing directly, not yet signed for the Play Store."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
