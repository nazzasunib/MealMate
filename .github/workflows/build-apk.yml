name: Build MealMate APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already ship an Android SDK (ANDROID_HOME is
      # preset) -- we just need to accept the licenses so Gradle/AGP can
      # auto-download whatever platform/build-tools version it needs.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n1)
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mealmate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to "latest-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: MealMate — Latest APK
          body: "Auto-built from the latest main branch. Debug build -- for testing/installing directly, not yet signed for the Play Store."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
